<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="grid-container">
        <div class="input" id="input">0</div>
        <div class="grid-content">
            
            <button class="btn-calc btn-action" data-action="clear">C</button>
            <button class="btn-calc btn-action" data-action="delete">Del</button>
            <button class="btn-calc btn-operator" data-action="divide">/</button>
            <button class="btn-calc btn-operator" data-action="multiply">*</button>
            
            <button class="btn-calc btn-number">7</button>
            <button class="btn-calc btn-number">8</button>
            <button class="btn-calc btn-number">9</button>
            <button class="btn-calc btn-operator" data-action="subtract">-</button>

            <button class="btn-calc btn-number">4</button>
            <button class="btn-calc btn-number">5</button>
            <button class="btn-calc btn-number">6</button>
            <button class="btn-calc btn-operator" data-action="add">+</button>

            <button class="btn-calc btn-number">1</button>
            <button class="btn-calc btn-number">2</button>
            <button class="btn-calc btn-number">3</button>
            <button class="btn-calc btn-equals" data-action="btn-equals">=</button>
            
            <button class="btn-calc btn-zero btn-number">0</button>
            <button class="btn-calc btn-number">.</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
